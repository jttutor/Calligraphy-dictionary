      + (r.gap ? `加外框（距離 ${cmText(r.gap)} 公分）後 <strong>${cmText(r.tw)} × ${cmText(r.th)} 公分</strong>｜` : '')
      + `紙張 ${paper} ${r.landscape ? '橫式' : '直式'}（${cmText(r.W)} × ${cmText(r.H)} 公分）｜`
      + (r.fits ? `四周留白：左右各 ${cmText(r.ox)}、上下各 ${cmText(r.oy)} 公分` : '放不下');
  }

  const warn = document.getElementById('grid-warn');
  if (!warn) return;
  const what = r.gap ? '格子加外框' : '格子';
  if (!r.fits) {
    const fitOptions = [];
    Object.entries(PAPERS).forEach(([k, p]) => {
      if (r.tw <= p.w + 0.01 && r.th <= p.h + 0.01) fitOptions.push(`${k} 直式`);
      else if (r.tw <= p.h + 0.01 && r.th <= p.w + 0.01) fitOptions.push(`${k} 橫式`);
    });
    const maxCols = Math.max(0, Math.floor((r.W - r.gap * 2 + 0.01) / r.cell));
    const maxRows = Math.max(0, Math.floor((r.H - r.gap * 2 + 0.01) / r.cell));
    warn.textContent = `⚠️ 放不下：${what} ${cmText(r.tw)} × ${cmText(r.th)} 公分比紙張大，印出來會被切掉。`
      + (fitOptions.length ? `改用 ${fitOptions.join('、')} 就放得下；` : '')
      + `這個大小在 ${paper} ${r.landscape ? '橫式' : '直式'}最多放橫 ${maxCols} × 直 ${maxRows} 格。`;
  } else if (Math.min(r.ox, r.oy) < 5) {
    warn.textContent = `⚠️ ${what}離紙邊只剩 ${cmText(Math.min(r.ox, r.oy))} 公分，有些印表機印不到這麼邊，最外面的框可能會被切掉。`;
  } else {
    warn.textContent = '';
  }
}

// =================================================================
// 存成圖片／分享（LINE、訊息、AirDrop、存到照片、無線列印）
// =================================================================
// 白底畫布：紙張 wMm × hMm。iPhone 畫布上限約 1600 萬像素，紙太大時自動降解析度
function makeSheetCanvas(wMm, hMm, dpi = 300) {
  const inW = wMm / 25.4, inH = hMm / 25.4;
  const d = Math.min(dpi, Math.floor(Math.sqrt(16000000 / (inW * inH))));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(inW * d);
  canvas.height = Math.round(inH * d);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  return { canvas, ctx, k: d / 25.4 };   // k：每公釐幾個像素
}

function gridPaperToCanvas(dpi) {
  const g = gridPaperLayers();
  const { canvas, ctx, k } = makeSheetCanvas(g.W, g.H, dpi);
  ctx.translate(g.gx * k, g.gy * k);
  ctx.scale(k, k);
  ctx.strokeStyle = g.color;
  g.layers.forEach(l => {
    ctx.lineWidth = l.w;
    ctx.setLineDash(l.dash || []);
    ctx.globalAlpha = l.opacity || 1;
    ctx.stroke(new Path2D(l.d));
  });
  return canvas;
}

// 出題目的 HTML 全部是 mm 絕對定位：照 inline style 把框線（border）和字畫到畫布上
function sheetHTMLToCanvas(html, wMm, hMm, dpi) {
  const { canvas, ctx, k } = makeSheetCanvas(wMm, hMm, dpi);
  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  const num = v => parseFloat(v) || 0;   // inline style 都是 mm
  const SIDES = ['Top', 'Right', 'Bottom', 'Left'];

  const drawBorders = (s, x, y) => {
    const bw = {};
    SIDES.forEach(sd => {
      const st = s[`border${sd}Style`];
      bw[sd] = st && st !== 'none' ? num(s[`border${sd}Width`]) : 0;
    });
    if (!SIDES.some(sd => bw[sd] > 0)) return;
    const borderBox = s.boxSizing === 'border-box';
    const w = num(s.width) + (borderBox ? 0 : bw.Left + bw.Right);
    const h = num(s.height) + (borderBox ? 0 : bw.Top + bw.Bottom);
    SIDES.forEach(sd => {
      const t = bw[sd];
      if (!t) return;
      ctx.strokeStyle = s[`border${sd}Color`] || '#000';
      ctx.lineWidth = t * k;
      ctx.setLineDash(s[`border${sd}Style`] === 'dashed' ? [2 * k, 1.5 * k] : []);
      ctx.beginPath();
      if (sd === 'Top')    { ctx.moveTo(x * k, (y + t / 2) * k);     ctx.lineTo((x + w) * k, (y + t / 2) * k); }
      if (sd === 'Bottom') { ctx.moveTo(x * k, (y + h - t / 2) * k); ctx.lineTo((x + w) * k, (y + h - t / 2) * k); }
      if (sd === 'Left')   { ctx.moveTo((x + t / 2) * k, y * k);     ctx.lineTo((x + t / 2) * k, (y + h) * k); }
      if (sd === 'Right')  { ctx.moveTo((x + w - t / 2) * k, y * k); ctx.lineTo((x + w - t / 2) * k, (y + h) * k); }
      ctx.stroke();
    });
  };

  const drawText = (el, s, x, y) => {
    const text = [...el.childNodes].filter(nd => nd.nodeType === 3).map(nd => nd.textContent).join('').trim();
    const fs = num(s.fontSize);
    if (!text || !fs) return;
    ctx.setLineDash([]);
    ctx.fillStyle = s.color || '#1a1a1a';
    ctx.font = `${s.fontWeight || 'normal'} ${fs * k}px ${s.fontFamily || 'serif'}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if ((s.writingMode || '').startsWith('vertical')) {
      // 直式落款：一個字一個字往下排（字距＝字大小＋letter-spacing）
      const ls = num(s.letterSpacing);
      const cx = x + num(s.width) / 2;
      [...text].forEach((ch, i) => ctx.fillText(ch, cx * k, (y + i * (fs + ls) + fs / 2) * k));
    } else if (s.display === 'flex') {
      ctx.fillText(text, (x + num(s.width) / 2) * k, (y + num(s.height) / 2) * k);
    } else {
      ctx.fillText(text, (x + num(s.width) / 2) * k, (y + fs / 2) * k);
    }
  };

  const walk = (el, ox, oy) => {
    for (const child of el.children) {
      const s = child.style;
      const x = ox + num(s.left), y = oy + num(s.top);
      drawBorders(s, x, y);
      drawText(child, s, x, y);
      walk(child, x, y);
    }
  };
  walk(tpl.content, 0, 0);
  return canvas;
}

// 手機：開分享選單（LINE、訊息、AirDrop、存到照片、列印）；不能分享的瀏覽器改成下載
async function shareCanvasImage(canvas, filename) {
  let blob;
  try {
    blob = await new Promise((resolve, reject) =>
      canvas.toBlob(b => (b ? resolve(b) : reject(new Error('圖片太大或瀏覽器不支援'))), 'image/png'));
  } catch (e) {
    toast('產生圖片失敗：' + e.message, 'error');
    return;
  }
  const file = new File([blob], filename, { type: 'image/png' });
  const url = URL.createObjectURL(blob);
  const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
  // iPhone 要「按下去當下」才能叫出分享選單，所以圖片先做好，再讓使用者按「分享」
  openModal('分享／存圖片', `
    <div style="text-align:center;">
      <img src="${url}" alt="" style="max-width:100%;max-height:55vh;border:1px solid var(--border);border-radius:4px;" />
    </div>
    <div class="tip" style="margin-top:12px;">
      ${canShare
        ? '按「📤 分享」可以傳 LINE、訊息、AirDrop、存到照片，或選「列印」用無線印表機印。'
        : '這個瀏覽器不能直接分享，請按「⬇ 下載圖片」。'}
      手機上也可以長按圖片 →「加入照片」。<br>
      ⚠️ 用圖片列印時，印表機可能會縮放；要剛好幾公分，請用頁面上的「🖨️ 列印」。
    </div>
    <div class="form-actions">
      <a class="btn" href="${url}" download="${escapeHTML(filename)}">⬇ 下載圖片</a>
      ${canShare ? '<button class="primary" id="btn-do-share">📤 分享</button>' : ''}
    </div>
  `);
  const btn = document.getElementById('btn-do-share');
  if (btn) btn.addEventListener('click', async () => {
    try {
      await navigator.share({ files: [file], title: filename.replace(/\.png$/, '') });
    } catch (e) {
      if (e.name !== 'AbortError') toast('分享失敗：' + e.message, 'error');
    }
  });
}

async function recognizeFrame(dataURL) {
  if (!apiConfig.apiKey) throw new Error('尚未設定 API key');
  const [meta, base64] = dataURL.split(',');
  const mimeMatch = /data:(image\/[a-z]+);base64/i.exec(meta || '');
  const mediaType = mimeMatch ? mimeMatch[1].toLowerCase() : 'image/jpeg';
  const body = {
    model: apiConfig.model,
    max_tokens: 1024,
    messages: [{
      role: 'user',
      content: [
        { type: 'image', source: { type: 'base64', media_type: mediaType, data: base64 } },
        { type: 'text', text: OCR_PROMPT },
      ],
    }],
  };
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': apiConfig.apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
      'content-type': 'application/json',
    },
    body: JSON.stringify(body),
  });
  if (!resp.ok) {
    const t = await resp.text().catch(() => '');
    throw new Error(`API ${resp.status}: ${t.slice(0, 200)}`);
  }
  const data = await resp.json();
  const text = (data.content && data.content[0] && data.content[0].text) || '';
  // 有時模型會用 ```json ... ``` 包起來，先剝掉
  const cleaned = text.trim()
    .replace(/^```json\s*/i, '')
    .replace(/^```\s*/, '')
    .replace(/\s*```$/, '');
  let parsed;
  try { parsed = JSON.parse(cleaned); }
  catch (e) { throw new Error('AI 回傳的不是合法 JSON：' + text.slice(0, 120)); }
  return {
    page: (typeof parsed.page === 'number' && parsed.page > 0) ? parsed.page : null,
    chars: Array.isArray(parsed.chars)
      ? parsed.chars.filter(c => typeof c === 'string' && c.trim().length > 0).map(c => c.trim())
      : [],
    topic: typeof parsed.topic === 'string' ? parsed.topic : '',
  };
}

async function recognizeSingleFrame(frame) {
  frame.ocrStatus = 'pending';
  frame.ocrError = null;
  render();
  try {
    const result = await recognizeFrame(frame.dataURL);
    frame.ocrStatus = 'done';
    if (result.page != null) frame.pageInput = String(result.page);
    if (result.chars.length > 0) frame.charsInput = result.chars.join('、');
    frame.ocrTopic = result.topic || '';
  } catch (e) {
    frame.ocrStatus = 'failed';
    frame.ocrError = e.message;
  }
  render();
}

async function batchRecognizeAll() {
  if (!apiConfig.apiKey) { toast('請先到 ⚙️ 設定填入 API key', 'error'); return; }
  if (uploadSession.recognizing) { toast('已經在辨識中', 'error'); return; }
  const targets = uploadSession.frames.filter(f =>
    !f.savedPage && !f.skipped && f.ocrStatus !== 'pending' && f.ocrStatus !== 'done'
  );
  if (targets.length === 0) { toast('沒有需要辨識的縮圖', 'error'); return; }
  uploadSession.recognizing = true;
  render();
  // 並行 2 個以免打太快被 rate limit
  const CONCURRENCY = 2;
  let idx = 0;
  let done = 0;
  async function worker() {
    while (idx < targets.length) {
      const my = idx++;
      const f = targets[my];
      f.ocrStatus = 'pending';
      f.ocrError = null;
      render();
      try {
        const result = await recognizeFrame(f.dataURL);
        f.ocrStatus = 'done';
        if (result.page != null) f.pageInput = String(result.page);
        if (result.chars.length > 0) f.charsInput = result.chars.join('、');
        f.ocrTopic = result.topic || '';
      } catch (e) {
        f.ocrStatus = 'failed';
        f.ocrError = e.message;
      }
      done++;
      render();
    }
  }
  const workers = Array.from({ length: Math.min(CONCURRENCY, targets.length) }, () => worker());
  await Promise.all(workers);
  uploadSession.recognizing = false;
  const okCount = targets.filter(f => f.ocrStatus === 'done').length;
  const failCount = targets.filter(f => f.ocrStatus === 'failed').length;
  toast(`辨識完成：成功 ${okCount}、失敗 ${failCount}`, failCount > 0 ? 'error' : 'success');
  render();
}

// 一鍵儲存所有已辨識、有有效頁碼和字的縮圖
async function saveAllRecognized() {
  const targets = uploadSession.frames.filter(f =>
    !f.savedPage && !f.skipped && f.ocrStatus === 'done'
    && f.pageInput && parseInt(f.pageInput, 10) > 0
    && parseCharString(f.charsInput || '').length > 0
  );
  if (targets.length === 0) { toast('沒有可以儲存的縮圖', 'error'); return; }
  // 檢查覆蓋衝突
  const conflicts = targets.filter(f => {
    const page = parseInt(f.pageInput, 10);
    const existing = (db.book_pages[uploadSession.bookId] || {})[String(page)];
    return existing && existing.chars && existing.chars.length > 0;
  });
  if (conflicts.length > 0) {
    if (!confirm(`有 ${conflicts.length} 張的頁碼已經在字帖裡有資料，繼續會覆蓋。確定？`)) return;
  }
  let ok = 0;
  for (const f of targets) {
    const page = parseInt(f.pageInput, 10);
    const chars = parseCharString(f.charsInput);
    savePage(uploadSession.bookId, page, chars, f.ocrTopic || '');
    f.savedPage = page;
    ok++;
  }
  toast(`已儲存 ${ok} 張`, 'success');
  render();
}

// =================================================================
// PWA: Service Worker
// =================================================================
function registerServiceWorker() {
  if (!('serviceWorker' in navigator)) return;
  // SW 只能在 https 或 localhost 環境註冊，file:// 直接跳過不報錯
  if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
    console.info('[PWA] 略過 service worker 註冊（非 https / localhost 環境）');
    return;
  }
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .then((reg) => console.info('[PWA] service worker 已註冊，scope:', reg.scope))
      .catch((err) => console.warn('[PWA] service worker 註冊失敗：', err));
  });
}

// 主畫面上的 App 不能下拉重整，用這顆按鈕抓最新版；資料存在這台裝置上，不受影響
async function refreshApp() {
  toast('正在抓最新版本…');
  try {
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) {
      await reg.update();
      const nw = reg.installing || reg.waiting;
      if (nw) {
        await new Promise((resolve) => {
          nw.addEventListener('statechange', () => {
            if (nw.state === 'activated' || nw.state === 'redundant') resolve();
          });
          setTimeout(resolve, 4000);
        });
      }
    }
  } catch (e) { /* 離線或檢查失敗：照樣重新載入 */ }
  location.reload();
}

// =================================================================
// Init
// =================================================================
function init() {
  if (!window.SEED_DATA) {
    document.getElementById('app').innerHTML = `
      <div class="empty">
        <h3>找不到種子資料</h3>
        <div>請確認 seed-data.js 與 index.html 在同一個資料夾。</div>
      </div>`;
    return;
  }
  db = loadDB();
  // Defensive defaults
  db.books = db.books || [];
  db.book_pages = db.book_pages || {};
  db.competitions = db.competitions || [];
  db.pending_uploads = db.pending_uploads || [];
  db.students = db.students || [];
  db.char_radicals = db.char_radicals || {};   // 字 → 部首（AI 分類快取，全學生共用）
  saveDB(); // rebuilds char_index + statistics

  loadApiConfig();
  loadSheetConfig();
  loadGridConfig();

  // Tab bindings
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => switchView(t.dataset.view));
  });

  // Toolbar bindings
  document.getElementById('btn-refresh').addEventListener('click', refreshApp);
  document.getElementById('btn-settings').addEventListener('click', openApiSettings);
  document.getElementById('btn-export').addEventListener('click', exportJSON);
  document.getElementById('btn-reset').addEventListener('click', resetSeed);
  document.getElementById('btn-import').addEventListener('click', () => {
    document.getElementById('file-import').click();
  });
  document.getElementById('file-import').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (f) importJSON(f);
    e.target.value = '';
  });

  // Esc to close modal
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  // 網址加 #sheet、#students… 直接開到該分頁；#sheet/k4、#sheet/lang 指定題型
  const [hashView, hashArg] = location.hash.slice(1).split('/');
  if (['competitions', 'books', 'lookup', 'upload', 'sheet', 'grid', 'students'].includes(hashView)) {
    view = { name: hashView, params: {} };
    if (hashView === 'sheet' && (hashArg === 'k4' || hashArg === 'lang')) sheetConfig.type = hashArg;
  }

  render();
  registerServiceWorker();
}

init();
</script>
