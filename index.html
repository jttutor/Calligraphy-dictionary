<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>兆婷藝術學院 · 書法比賽管理系統</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="theme-color" content="#37352f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="書法系統" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="application-name" content="書法系統" />
<style>
  /* ===== Notion-like styling ===== */
  :root {
    --bg: #ffffff;
    --bg-soft: #f7f6f3;
    --bg-hover: #f1f1ef;
    --text: #37352f;
    --text-soft: #787774;
    --text-faint: #9b9a97;
    --border: #e9e9e7;
    --border-strong: #d3d2cf;
    --accent: #2383e2;
    --accent-soft: #e7f3fb;
    --danger: #e03e3e;
    --danger-soft: #fbe4e4;
    --success: #0f7b6c;
    --success-soft: #ddedea;
    --warn-bg: #fdecc8;
    --warn-text: #b07b29;
    --radius: 6px;
    --shadow-sm: 0 1px 2px rgba(15, 15, 15, 0.05);
    --shadow-md: 0 4px 12px rgba(15, 15, 15, 0.12);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
                 "Microsoft JhengHei", "Heiti TC", sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== Top bar ===== */
  .topbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    align-items: center;
    justify-content: space-between;
    padding: 14px 32px;
    padding-top: calc(14px + env(safe-area-inset-top));
    padding-left: calc(32px + env(safe-area-inset-left));
    padding-right: calc(32px + env(safe-area-inset-right));
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .footer-hint {
    padding-bottom: calc(24px + env(safe-area-inset-bottom)) !important;
  }
  .topbar-left { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; min-width: 0; }
  .brand {
    font-weight: 600;
    font-size: 15px;
    color: var(--text);
  }
  .brand-sub {
    color: var(--text-faint);
    font-size: 13px;
    margin-left: 8px;
  }
  /* 分頁放不下時整排左右滑，字不要被擠成一字一行 */
  .tabs { display: flex; gap: 4px; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tab {
    padding: 6px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    color: var(--text-soft);
    font-size: 14px;
    user-select: none;
    transition: background 0.1s ease;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .tab:hover { background: var(--bg-hover); }
  .tab.active { background: var(--bg-soft); color: var(--text); font-weight: 500; }
  .topbar-right { display: flex; flex-wrap: wrap; gap: 6px; }
  .topbar-right button { white-space: nowrap; }

  /* ===== Buttons ===== */
  button, .btn {
    font-family: inherit;
    font-size: 14px;
    padding: 6px 12px;
    border: 1px solid var(--border-strong);
    background: var(--bg);
    color: var(--text);
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.1s ease;
    line-height: 1.4;
  }
  button:hover, .btn:hover { background: var(--bg-hover); }
  button.primary, .btn.primary {
    background: var(--text);
    color: #fff;
    border-color: var(--text);
  }
  button.primary:hover, .btn.primary:hover { background: #1f1e1a; }
  button.danger, .btn.danger {
    color: var(--danger);
    border-color: var(--border);
  }
  button.danger:hover, .btn.danger:hover { background: var(--danger-soft); }
  button.ghost, .btn.ghost {
    border-color: transparent;
    color: var(--text-soft);
    padding: 4px 8px;
  }
  button.ghost:hover, .btn.ghost:hover { background: var(--bg-hover); color: var(--text); }
  button.sm { padding: 4px 10px; font-size: 13px; }

  /* ===== Layout ===== */
  .container {
    max-width: 1080px;
    margin: 0 auto;
    padding: 32px;
  }
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .page-title {
    font-size: 28px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .page-subtitle {
    color: var(--text-soft);
    font-size: 14px;
    margin-top: 4px;
  }
  .section { margin-top: 32px; }
  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 12px;
  }

  /* ===== Card / Table ===== */
  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }
  .card + .card { margin-top: 12px; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  th {
    font-weight: 500;
    color: var(--text-soft);
    font-size: 13px;
    background: var(--bg-soft);
  }
  tr:last-child td { border-bottom: none; }
  tbody tr { transition: background 0.1s; }
  tbody tr:hover { background: var(--bg-soft); }
  .row-actions {
    display: flex;
    gap: 4px;
    justify-content: flex-end;
  }
  td.col-actions { text-align: right; width: 1%; white-space: nowrap; }

  .table-wrap {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  /* ===== Form ===== */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .form-grid .full { grid-column: 1 / -1; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
  }
  .field .help {
    font-size: 12px;
    color: var(--text-faint);
  }
  .field .required { color: var(--danger); margin-left: 2px; }
  input[type="text"], input[type="number"], input[type="date"], select, textarea {
    font-family: inherit;
    font-size: 14px;
    padding: 8px 10px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--text);
    width: 100%;
    outline: none;
    transition: border-color 0.1s, box-shadow 0.1s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-soft);
  }
  textarea { resize: vertical; min-height: 96px; font-family: inherit; }
  .form-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  /* ===== Modal ===== */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 15, 15, 0.4);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 60px;
    z-index: 100;
  }
  .modal {
    background: var(--bg);
    border-radius: 8px;
    box-shadow: var(--shadow-md);
    width: 100%;
    max-width: 720px;
    max-height: calc(100vh - 100px);
    display: flex;
    flex-direction: column;
  }
  .modal-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-title { font-size: 18px; font-weight: 600; margin: 0; }
  .modal-body {
    padding: 20px 24px;
    overflow-y: auto;
    flex: 1;
  }
  .modal-close {
    border: none;
    background: transparent;
    font-size: 20px;
    color: var(--text-soft);
    cursor: pointer;
    padding: 4px 8px;
  }
  .modal-close:hover { background: var(--bg-hover); border-radius: 4px; }

  /* ===== Badge ===== */
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 500;
    background: var(--bg-soft);
    color: var(--text-soft);
  }
  .badge.ok { background: var(--success-soft); color: var(--success); }
  .badge.warn { background: var(--warn-bg); color: var(--warn-text); }
  .badge.bad { background: var(--danger-soft); color: var(--danger); }

  /* ===== Char chips ===== */
  .char-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
    gap: 8px;
  }
  .char-chip {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 4px;
    text-align: center;
    font-size: 22px;
    font-family: "Kaiti TC", "Kaiti SC", "STKaiti", "DFKai-SB", "標楷體", serif;
    cursor: default;
  }
  .char-chip:hover { background: #fff; border-color: var(--border-strong); }

  /* ===== Lookup result table ===== */
  .lookup-table .char-cell {
    font-size: 22px;
    font-family: "Kaiti TC", "Kaiti SC", "STKaiti", "DFKai-SB", "標楷體", serif;
    width: 60px;
    text-align: center;
  }
  .lookup-table .not-found {
    color: var(--danger);
  }
  .lookup-table .not-found .char-cell {
    color: var(--danger);
    background: var(--danger-soft);
  }

  /* ===== Empty state ===== */
  .empty {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-faint);
    font-size: 14px;
  }
  .empty h3 {
    color: var(--text-soft);
    font-weight: 500;
    margin: 0 0 8px 0;
  }

  /* ===== Toast ===== */
  .toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .toast {
    background: var(--text);
    color: #fff;
    padding: 10px 16px;
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    font-size: 14px;
    min-width: 200px;
    animation: slideUp 0.2s ease;
  }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }
  @keyframes slideUp {
    from { transform: translateY(8px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* ===== Poem display ===== */
  .poem-block {
    font-size: 18px;
    line-height: 2;
    font-family: "Kaiti TC", "Kaiti SC", "STKaiti", "DFKai-SB", "標楷體", serif;
    padding: 16px 20px;
    background: var(--bg-soft);
    border-radius: var(--radius);
    border-left: 3px solid var(--text);
    margin: 12px 0;
    white-space: pre-wrap;
  }

  /* ===== Detail meta ===== */
  .meta-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin: 16px 0;
  }
  .meta-item {
    background: var(--bg-soft);
    padding: 10px 14px;
    border-radius: var(--radius);
  }
  .meta-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
    font-weight: 500;
  }
  .meta-value {
    font-size: 15px;
    color: var(--text);
    margin-top: 2px;
  }

  .breadcrumb {
    font-size: 13px;
    color: var(--text-faint);
    margin-bottom: 8px;
  }
  .breadcrumb a {
    color: var(--text-soft);
    text-decoration: none;
    cursor: pointer;
  }
  .breadcrumb a:hover { color: var(--text); text-decoration: underline; }

  /* ===== Search box ===== */
  .search-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
    margin-bottom: 16px;
  }
  .search-row input { flex: 1; }

  /* Single char lookup mini result */
  .single-result {
    background: var(--bg-soft);
    border-radius: var(--radius);
    padding: 20px;
    margin-top: 12px;
    text-align: center;
  }
  .single-result .big-char {
    font-size: 64px;
    font-family: "Kaiti TC", "Kaiti SC", "STKaiti", "DFKai-SB", "標楷體", serif;
    line-height: 1;
  }
  .single-result .pages {
    margin-top: 12px;
    font-size: 16px;
  }
  .single-result .pages strong { font-weight: 600; }

  /* Tip box */
  .tip {
    font-size: 13px;
    color: var(--text-soft);
    background: var(--bg-soft);
    border-radius: var(--radius);
    padding: 10px 14px;
    margin-bottom: 12px;
  }

  /* Stats */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--bg-soft);
    padding: 14px 16px;
    border-radius: var(--radius);
  }
  .stat-label {
    font-size: 12px;
    color: var(--text-soft);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .stat-value {
    font-size: 24px;
    font-weight: 700;
    margin-top: 4px;
  }

  /* Page jump (book pages overview) */
  .page-pill-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 6px;
    margin-top: 12px;
  }
  .page-pill {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px;
    text-align: center;
    cursor: pointer;
    font-size: 13px;
    background: var(--bg);
    transition: all 0.1s;
  }
  .page-pill:hover { background: var(--bg-soft); border-color: var(--border-strong); }
  .page-pill.active { background: var(--text); color: #fff; border-color: var(--text); }

  /* Footer hint */
  .footer-hint {
    text-align: center;
    color: var(--text-faint);
    font-size: 12px;
    padding: 24px 0;
  }

  /* ===== Phase 2: Upload / annotation ===== */
  .upload-dropzone {
    border: 2px dashed var(--border-strong);
    border-radius: var(--radius);
    padding: 40px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.1s, background 0.1s;
  }
  .upload-dropzone:hover, .upload-dropzone.drag-over {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .upload-dropzone .icon { font-size: 32px; }
  .upload-dropzone .hint { color: var(--text-soft); font-size: 13px; margin-top: 4px; }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 12px 0;
  }
  .progress-bar {
    flex: 1;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.15s ease;
    width: 0%;
  }
  .progress-text { font-size: 13px; color: var(--text-soft); white-space: nowrap; }

  .upload-steps {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .step {
    flex: 1;
    min-width: 200px;
    background: var(--bg-soft);
    padding: 12px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    font-size: 14px;
  }
  .step.active { border-color: var(--accent); background: var(--accent-soft); }
  .step.done { border-color: var(--success); background: var(--success-soft); }
  .step-num {
    display: inline-block;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--text-soft);
    color: #fff;
    text-align: center;
    font-size: 12px;
    line-height: 20px;
    margin-right: 8px;
  }
  .step.active .step-num { background: var(--accent); }
  .step.done .step-num { background: var(--success); }

  .thumb-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
    margin-top: 16px;
  }
  .thumb-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: border-color 0.1s, background 0.1s;
  }
  .thumb-card.saved {
    border-color: var(--success);
    background: var(--success-soft);
  }
  .thumb-card.skipped { opacity: 0.55; }
  .thumb-img-wrap {
    position: relative;
    background: #000;
    aspect-ratio: 16/9;
    overflow: hidden;
    cursor: zoom-in;
  }
  .thumb-img-wrap img { width: 100%; height: 100%; object-fit: contain; }
  .thumb-time {
    position: absolute;
    bottom: 4px;
    right: 4px;
    background: rgba(0,0,0,0.7);
    color: #fff;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 3px;
  }
  .thumb-body {
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .thumb-body input {
    font-size: 13px;
    padding: 5px 8px;
  }
  .thumb-body .field-row {
    display: flex;
    gap: 4px;
    align-items: center;
  }
  .thumb-body .field-row label {
    font-size: 12px;
    color: var(--text-soft);
    width: 36px;
  }
  .thumb-actions {
    display: flex;
    gap: 4px;
    margin-top: 4px;
  }
  .thumb-actions button {
    font-size: 12px;
    padding: 4px 8px;
    flex: 1;
  }
  .saved-tag {
    font-size: 12px;
    color: var(--success);
    font-weight: 500;
    text-align: center;
    padding: 4px;
  }
  .ocr-status {
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 4px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .ocr-status.pending { background: var(--accent-soft); color: var(--accent); }
  .ocr-status.done    { background: var(--success-soft); color: var(--success); }
  .ocr-status.failed  { background: var(--danger-soft); color: var(--danger); }
  .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .api-status-banner {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    margin-bottom: 16px;
  }
  .api-status-banner.ok { background: var(--success-soft); color: var(--success); }
  .api-status-banner.warn { background: var(--warn-bg); color: var(--warn-text); }
  .api-status-banner strong { font-weight: 600; }
  .api-status-banner a, .api-status-banner button.link {
    color: inherit;
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    font: inherit;
  }
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 300;
    cursor: zoom-out;
  }
  .lightbox img {
    max-width: 95vw;
    max-height: 95vh;
    object-fit: contain;
  }

  /* ===== 出題目（列印） ===== */
  .sheet-controls {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .sheet-preview-wrap {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #e9e8e6;
    padding: 24px;
    display: flex;
    justify-content: center;
    overflow: auto;
  }
  .print-sheet {
    background: #fff;
    box-shadow: 0 2px 14px rgba(0, 0, 0, 0.18);
    position: relative;
  }
  /* 列印時只印 #print-root（printHTML 填入），其他全部不佔版面 */
  #print-root { display: none; }
  @media print {
    html, body { background: #fff !important; }
    body > *:not(#print-root) { display: none !important; }
    #print-root { display: block !important; }
    #print-root .print-sheet { box-shadow: none !important; overflow: hidden; }
  }

  /* ===== 學生字庫分類 ===== */
  .cat-group { margin-bottom: 20px; }
  .cat-group-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-soft);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cat-group-title .badge { font-weight: 500; }
  .char-chip.removable { cursor: pointer; }
  .char-chip.removable:hover {
    background: var(--danger-soft);
    border-color: var(--danger);
    color: var(--danger);
  }

要辨識三件事：

function loadApiConfig() {

      const parsed = JSON.parse(raw);
      apiConfig = { ...apiConfig, ...parsed };

  } catch (e) { /* ignore */ }
}
function saveApiConfig() {
  localStorage.setItem(API_STORAGE_KEY, JSON.stringify(apiConfig));
}

function rebuildCharIndex() {
  const index = {};
  for (const bookId in db.book_pages) {
    for (const pageStr in db.book_pages[bookId]) {
      const page = parseInt(pageStr, 10);
      const chars = db.book_pages[bookId][pageStr].chars || [];
      for (const ch of chars) {
        if (!index[ch]) index[ch] = [];
        // Avoid duplicates
        const exists = index[ch].some(e => e.book_id === bookId && e.page === page);
        if (!exists) index[ch].push({ book_id: bookId, page });
      }
    }
  }
  db.char_index = index;
}

function updateStatistics() {
  let totalPages = 0;
  for (const bookId in db.book_pages) {
    totalPages += Object.keys(db.book_pages[bookId]).length;
  }
  db.statistics = {
    total_books: (db.books || []).length,
    total_pages: totalPages,
    total_unique_chars: Object.keys(db.char_index || {}).length,
    total_competitions: (db.competitions || []).length,
  };
}

// ---------- Helpers ----------
function uid(prefix) {
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}
function todayISO() {
  return new Date().toISOString().slice(0, 10);
}
function escapeHTML(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function bookNameById(bookId) {
  const b = (db.books || []).find(b => b.id === bookId);
  return b ? b.name : '（未知字帖）';
}

// CJK detect: keep characters in CJK Unified + Extension A; ignore everything else
function extractChars(text) {
  if (!text) return [];
  const out = [];
  for (const ch of text) {
    if (/[㐀-䶿一-鿿]/.test(ch)) out.push(ch);
  }
  return out;
}

function lookupChar(char) {
  const entries = (db.char_index && db.char_index[char]) || [];
  return entries.map(e => ({
    book_id: e.book_id,
    book_name: bookNameById(e.book_id),
    page: e.page,
  }));
}

// ---------- Competition CRUD ----------
function openCompetitionForm(id) {
  const isEdit = !!id;
  const c = isEdit
    ? (db.competitions || []).find(x => x.id === id)
    : {
        id: uid('comp'),
        name: '',
        year: new Date().getFullYear(),
        round: '',
        deadline: '',
        specification: { paper_size: '4K', paper_size_options: PAPER_SIZES.slice(), notes: '' },
        source_book_id: (db.books[0] && db.books[0].id) || '',
        poem_text: '',
        theme: '',
        created_at: todayISO(),
        notes: '',
      };
  if (!c) return;

  const bookOptions = (db.books || []).map(b =>
    `<option value="${escapeHTML(b.id)}" ${b.id === c.source_book_id ? 'selected' : ''}>${escapeHTML(b.name)}</option>`
  ).join('');
  const sizeOptions = PAPER_SIZES.map(s =>
    `<option value="${s}" ${s === ((c.specification && c.specification.paper_size) || '4K') ? 'selected' : ''}>${s}</option>`
  ).join('');

  const html = `
    <form id="comp-form" class="form-grid">
      <div class="field full">
        <label>比賽名稱<span class="required">*</span></label>
        <input type="text" name="name" required value="${escapeHTML(c.name)}" placeholder="例：吳沙書法比賽" />
      </div>
      <div class="field">
        <label>年份<span class="required">*</span></label>
        <input type="number" name="year" required min="1900" max="2999" value="${c.year || ''}" />
      </div>
      <div class="field">
        <label>回合 / 場次</label>
        <input type="text" name="round" value="${escapeHTML(c.round || '')}" placeholder="例：第一回 / 春季 / 縣賽" />
      </div>
      <div class="field">
        <label>截止日期<span class="required">*</span></label>
        <input type="date" name="deadline" required value="${escapeHTML(c.deadline || '')}" />
      </div>
      <div class="field">
        <label>比賽規格<span class="required">*</span></label>
        <select name="paper_size">${sizeOptions}</select>
      </div>
      <div class="field full">
        <label>來源字帖<span class="required">*</span></label>
        <select name="source_book_id" required>${bookOptions}</select>
      </div>
      <div class="field full">
        <label>題目內容（詩）<span class="required">*</span></label>
        <textarea name="poem_text" required placeholder="貼上詩文，標點符號會自動忽略">${escapeHTML(c.poem_text || '')}</textarea>
        <div class="help">系統會逐字找對應頁碼，標點和空白會自動忽略。</div>
      </div>
      <div class="field full">
        <label>比賽主題 / 備註</label>
        <input type="text" name="theme" value="${escapeHTML(c.theme || '')}" placeholder="例：宜蘭礁溪湯圍溫泉" />
      </div>
      <div class="field full">
        <label>其他備註</label>
        <textarea name="notes" placeholder="（選填）">${escapeHTML(c.notes || '')}</textarea>
      </div>
      <div class="form-actions full">
        <button type="button" class="ghost" onclick="closeModal()">取消</button>
        <button type="submit" class="primary">${isEdit ? '更新比賽' : '新增比賽'}</button>
      </div>
    </form>
  `;

  openModal(isEdit ? '編輯比賽' : '新增比賽', html);

  document.getElementById('comp-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const updated = {
      ...c,
      name: fd.get('name').trim(),
      year: parseInt(fd.get('year'), 10) || c.year,
      round: fd.get('round').trim(),
      deadline: fd.get('deadline'),
      specification: {
        paper_size: fd.get('paper_size'),
        paper_size_options: PAPER_SIZES.slice(),
        notes: (c.specification && c.specification.notes) || '',
      },
      source_book_id: fd.get('source_book_id'),
      poem_text: fd.get('poem_text'),
      theme: fd.get('theme').trim(),
      notes: fd.get('notes'),
    };
    if (!isEdit) {
      db.competitions = db.competitions || [];
      db.competitions.push(updated);
    } else {
      const idx = db.competitions.findIndex(x => x.id === id);
      db.competitions[idx] = updated;
    }
    saveDB();
    closeModal();
    toast(isEdit ? '比賽已更新' : '比賽已新增', 'success');
    if (view.name === 'competition') switchView('competition', { id: updated.id });
    else render();
  });
}

function deleteCompetition(id) {
  const c = db.competitions.find(x => x.id === id);
  if (!c) return;
  if (!confirm(`確定要刪除比賽「${c.name}」？此動作無法復原。`)) return;
  db.competitions = db.competitions.filter(x => x.id !== id);
  saveDB();
  toast('比賽已刪除', 'success');
  if (view.name === 'competition') switchView('competitions');
  else render();
}

function renderPageContent(bookId, pageStr, stuId) {
  const pageData = (db.book_pages[bookId] || {})[pageStr];
  if (!pageData) return '';
  const stu = stuId ? (db.students || []).find(x => x.id === stuId) : null;
  const learnedSet = stu ? new Set(stu.learned_chars || []) : null;
  const chars = pageData.chars || [];
  const learnedOnPage = stu ? chars.filter(ch => learnedSet.has(ch)).length : 0;
  return `
    <div class="section">
      <div class="section-title">
        第 ${pageStr} 頁
        <span style="float:right;font-weight:normal;text-transform:none;letter-spacing:0;color:var(--text-soft)">
          ${stu ? `<span class="badge ok">本頁已學 ${learnedOnPage}/${chars.length}</span>　` : ''}
          ${pageData.topic ? escapeHTML(pageData.topic) + '　' : ''}
          <button class="sm ghost" onclick="openManualPageForm('${bookId}', ${parseInt(pageStr, 10)})">✏️ 編輯</button>
        </span>
      </div>
      ${stu ? `<div class="tip">正在為 <strong>${escapeHTML(stu.name)}</strong> 標記：點字切換 <span class="badge ok">已學 ✓</span> / 未學，會直接存進他的字庫。</div>` : ''}
      <div class="char-grid">
        ${chars.map(ch => {
          const isLearned = learnedSet ? learnedSet.has(ch) : false;
          return `<div class="char-chip${stu ? ' tappable' : ''}${isLearned ? ' learned' : ''}"${stu ? ` data-mark-char="${escapeHTML(ch)}"` : ''}>${escapeHTML(ch)}</div>`;
        }).join('')}
      </div>
    </div>
  `;
}

function renderLookup(app) {
  app.innerHTML = `
    <div class="page-header">
      <div>
        <h1 class="page-title">查字找頁碼</h1>
        <div class="page-subtitle">支援單字查詢，或整首詩一次查完。</div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">單字查詢</div>
      <div class="search-row">
        <input type="text" id="single-char" placeholder="輸入一個字，例：把" maxlength="4" />
        <button class="primary" id="btn-single">查詢</button>
      </div>
      <div id="single-result"></div>
    </div>

    <div class="section">
      <div class="section-title">整首詩查詢</div>
      <div class="tip">貼上整首詩或一段文字，系統會自動拆字查詢，標點與空白會被忽略。</div>
      <textarea id="poem-input" placeholder="例：泉流瀉出半清湍，唯有湯圍水異香。是否天工鑪火後，浴盆把住不驚寒。"></textarea>
      <div style="margin-top:8px;display:flex;gap:8px;">
        <button class="primary" id="btn-poem">查詢整首詩</button>
        <button class="ghost" id="btn-clear-poem">清空</button>
      </div>
      <div id="poem-result" style="margin-top:16px;"></div>
    </div>
  `;

  const singleInput = document.getElementById('single-char');
  singleInput.focus();
  document.getElementById('btn-single').addEventListener('click', doSingleLookup);
  singleInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') doSingleLookup(); });

  document.getElementById('btn-poem').addEventListener('click', doPoemLookup);
  document.getElementById('btn-clear-poem').addEventListener('click', () => {
    document.getElementById('poem-input').value = '';
    document.getElementById('poem-result').innerHTML = '';
  });
}

function doSingleLookup() {
  const raw = document.getElementById('single-char').value;
  const chars = extractChars(raw);
  const out = document.getElementById('single-result');
  if (chars.length === 0) {
    out.innerHTML = `<div class="tip">請輸入一個中文字。</div>`;
    return;
  }
  const ch = chars[0];
  const results = lookupChar(ch);
  if (results.length === 0) {
    out.innerHTML = `
      <div class="single-result">
        <div class="big-char" style="color:var(--danger)">${escapeHTML(ch)}</div>
        <div class="pages"><span class="badge bad">✗ 查無此字</span></div>
      </div>`;
  } else {
    out.innerHTML = `
      <div class="single-result">
        <div class="big-char">${escapeHTML(ch)}</div>
        <div class="pages">
          ${results.map(r => `<div>${escapeHTML(r.book_name)} · <strong>第 ${r.page} 頁</strong></div>`).join('')}
        </div>
      </div>`;
  }
}

function doPoemLookup() {
  const raw = document.getElementById('poem-input').value;
  const chars = extractChars(raw);
  const out = document.getElementById('poem-result');
  if (chars.length === 0) {
    out.innerHTML = `<div class="tip">沒有偵測到中文字。</div>`;
    return;
  }
  const foundCount = chars.filter(ch => lookupChar(ch).length > 0).length;

  out.innerHTML = `
    <div style="margin-bottom:10px;color:var(--text-soft);font-size:13px">
      共 ${chars.length} 字 · 已對應 <strong style="color:var(--success)">${foundCount}</strong> 字 · 待補 <strong style="color:var(--danger)">${chars.length - foundCount}</strong> 字
    </div>
    <div class="table-wrap">
      <table class="lookup-table">
        <thead><tr><th style="width:60px">字</th><th>對應頁碼</th></tr></thead>
        <tbody>
          ${chars.map(ch => {
            const results = lookupChar(ch);
            const found = results.length > 0;
            return `
              <tr class="${found ? '' : 'not-found'}">
                <td class="char-cell">${escapeHTML(ch)}</td>
                <td>${found
                  ? results.map(r => `<span class="badge ok">${escapeHTML(r.book_name)} · 第 ${r.page} 頁</span>`).join(' ')
                  : `<span class="badge bad">✗ 待補</span>`}</td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderUpload(app) {
  const books = db.books || [];
  if (books.length === 0) {
    app.innerHTML = `
      <div class="page-header"><div><h1 class="page-title">補資料</h1></div></div>
      <div class="empty">
        <h3>還沒有任何字帖</h3>
        <div>請先到「字帖瀏覽」新增一本字帖。</div>
        <div style="margin-top:12px"><button class="primary" onclick="openBookForm(null)">➕ 新增字帖</button></div>
      </div>`;
    return;
  }

  // Default book = first book if none chosen
  if (!uploadSession.bookId) uploadSession.bookId = books[0].id;
  const currentBook = books.find(b => b.id === uploadSession.bookId) || books[0];
  uploadSession.bookId = currentBook.id;

  const step1Done = !!uploadSession.bookId;
  const step2Done = uploadSession.frames.length > 0;
  const step3Done = step2Done && uploadSession.frames.every(f => f.savedPage || f.skipped);

  const savedCount = uploadSession.frames.filter(f => f.savedPage).length;
  const skippedCount = uploadSession.frames.filter(f => f.skipped).length;

  const hasApiKey = !!apiConfig.apiKey;
  const apiBanner = hasApiKey
    ? `<div class="api-status-banner ok">
         ✨ <span>AI 自動辨識<strong>已啟用</strong>（${escapeHTML((AI_MODELS.find(m => m.id === apiConfig.model) || {}).name || apiConfig.model)}）—— 上傳後每張自動辨識頁碼和字，你只要確認就好。</span>
         <button class="link" onclick="openApiSettings()">變更設定</button>
       </div>`
    : `<div class="api-status-banner warn">
         ⚠️ <span><strong>還沒設定 API key</strong>——上傳後要你自己一張張打字。設定後改成 AI 自動辨識、只需確認。</span>
         <button class="link" onclick="openApiSettings()">立即設定</button>
       </div>`;

  app.innerHTML = `
    <div class="page-header">
      <div>
        <h1 class="page-title">📸 補資料</h1>
        <div class="page-subtitle">上傳影片每秒擷取一張，或直接上傳照片，AI 自動辨識頁碼與該頁的字，你只要確認。</div>
      </div>
      ${uploadSession.frames.length > 0 ? `<button class="ghost" id="btn-clear-session">↺ 清空目前工作</button>` : ''}
    </div>

    ${apiBanner}

    <div class="upload-steps">
      <div class="step ${step1Done ? 'done' : 'active'}"><span class="step-num">1</span>選擇字帖</div>

        <input type="file" id="upload-input" accept="video/*,image/*" multiple style="display:none" />

        </select>

      </div>
      <div id="extract-progress" style="display:none">
        <div class="progress-row">
          <div class="progress-bar"><div class="progress-bar-fill" id="extract-progress-fill"></div></div>
          <div class="progress-text" id="extract-progress-text">0 %</div>
        </div>
      </div>
    </div>

    ${uploadSession.frames.length > 0 ? `
      <div class="section">
        <div class="section-title">

            共 ${uploadSession.frames.length} 張 · 已儲存 <strong style="color:var(--success)">${savedCount}</strong> · 跳過 ${skippedCount}
          </span>
        </div>
        ${hasApiKey ? `
          <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
            <button class="primary" onclick="batchRecognizeAll()" ${uploadSession.recognizing ? 'disabled' : ''}>
              ${uploadSession.recognizing ? '<span class="spinner"></span> 辨識中…' : '🤖 全部辨識（未辨識的）'}
            </button>
            <button onclick="saveAllRecognized()" ${uploadSession.recognizing ? 'disabled' : ''}>💾 全部儲存（已辨識的）</button>
          </div>
        ` : `
          <div class="tip">
            <strong>頁碼</strong>填數字；<strong>字</strong>用 <code>、</code>、空白、逗號或換行分隔都可以。儲存後會自動更新查字索引。
          </div>
        `}
        <div class="thumb-grid" id="thumb-grid">
          ${uploadSession.frames.map(f => renderThumbCard(f)).join('')}
        </div>
        ${step3Done ? `
          <div style="margin-top:16px;text-align:center;">
            <button class="primary" onclick="finishUploadSession()">✅ 完成，前往字帖瀏覽</button>

      </div>

  // Bindings
  document.getElementById('upload-book-select').addEventListener('change', (e) => {
    if (uploadSession.frames.length > 0) {
      if (!confirm('切換字帖會清空目前的工作（已儲存的頁碼不受影響）。確定切換？')) {
        e.target.value = uploadSession.bookId;
        return;
      }
      uploadSession.frames = [];
    }
    uploadSession.bookId = e.target.value;
    render();
  });

  const zone = document.getElementById('upload-zone');
  const input = document.getElementById('upload-input');
  zone.addEventListener('click', () => input.click());
  zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    handleUploadFiles(e.dataTransfer.files);
  });
  input.addEventListener('change', (e) => handleUploadFiles(e.target.files));

  const clearBtn = document.getElementById('btn-clear-session');
  if (clearBtn) clearBtn.onclick = () => {
    if (!confirm('清空目前工作？已儲存到字帖的頁碼不受影響。')) return;
    uploadSession.frames = [];
    render();
  };

  // Bind per-card actions
  document.querySelectorAll('.thumb-card').forEach(card => bindThumbCardActions(card));
}

function renderThumbCard(frame) {
  const f = frame;
  const isSaved = !!f.savedPage;
  const isSkipped = !!f.skipped;
  const stateClass = isSaved ? 'saved' : (isSkipped ? 'skipped' : '');
  const timeLabel = f.label || (f.timeSec != null ? `${Math.floor(f.timeSec)}s` : '');

  // OCR 狀態列
  let ocrRow = '';
  if (!isSaved) {
    if (f.ocrStatus === 'pending') {
      ocrRow = `<div class="ocr-status pending"><span class="spinner"></span> AI 辨識中…</div>`;
    } else if (f.ocrStatus === 'done') {
      ocrRow = `<div class="ocr-status done">✨ AI 已辨識，請確認</div>`;
    } else if (f.ocrStatus === 'failed') {
      ocrRow = `<div class="ocr-status failed" title="${escapeHTML(f.ocrError || '')}">❌ 辨識失敗 <button class="link" data-act="retry-ocr" style="margin-left:4px;">重試</button></div>`;
    } else if (apiConfig.apiKey) {
      ocrRow = `<div style="text-align:center;"><button data-act="run-ocr" style="font-size:12px;padding:2px 8px;">🤖 這張辨識</button></div>`;
    }
  }

  return `
    <div class="thumb-card ${stateClass}" data-fid="${f.id}">
      <div class="thumb-img-wrap" data-act="zoom">
        <img src="${f.dataURL}" alt="" loading="lazy" />
        ${timeLabel ? `<div class="thumb-time">${escapeHTML(timeLabel)}</div>` : ''}
      </div>
      <div class="thumb-body">
        ${isSaved ? `
          <div class="saved-tag">✓ 已存到第 ${f.savedPage} 頁</div>
          <div style="font-size:12px;color:var(--text-soft);text-align:center;">字：${escapeHTML((f.charsInput || '').slice(0, 40))}</div>
          <div class="thumb-actions">
            <button data-act="reedit">重新編輯</button>
          </div>
        ` : `
          ${ocrRow}
          <div class="field-row"><label>頁碼</label><input type="number" data-field="page" value="${escapeHTML(f.pageInput || '')}" placeholder="例：30" /></div>
          <div class="field-row"><label>字</label><input type="text" data-field="chars" value="${escapeHTML(f.charsInput || '')}" placeholder="例：泉、流、清、出、有" /></div>
          <div class="thumb-actions">
            <button class="primary" data-act="save">儲存</button>
            <button data-act="skip">跳過</button>
            <button class="danger" data-act="remove">刪除</button>
          </div>
        `}
      </div>
    </div>
  `;
}

function bindThumbCardActions(card) {
  const fid = card.dataset.fid;
  const findFrame = () => uploadSession.frames.find(x => x.id === fid);
  card.querySelectorAll('[data-act]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const act = el.dataset.act;
      const f = findFrame();
      if (!f) return;
      if (act === 'zoom') openLightbox(f.dataURL);
      else if (act === 'save') saveThumbCard(card, f);
      else if (act === 'skip') { f.skipped = true; render(); }
      else if (act === 'remove') {
        uploadSession.frames = uploadSession.frames.filter(x => x.id !== fid);
        render();
      } else if (act === 'reedit') {
        // Detach saved state (don't auto-remove from book; user may re-save with different content)
        f.savedPage = null;
        f.skipped = false;
        render();
      } else if (act === 'run-ocr' || act === 'retry-ocr') {
        recognizeSingleFrame(f);
      }
    });
  });
  // Sync inputs back to frame so re-render preserves them
  card.querySelectorAll('[data-field]').forEach(inp => {
    inp.addEventListener('input', () => {
      const f = findFrame(); if (!f) return;
      const field = inp.dataset.field;
      if (field === 'page') f.pageInput = inp.value;
      else if (field === 'chars') f.charsInput = inp.value;
    });
  });
}

function saveThumbCard(card, f) {
  const pageInput = card.querySelector('[data-field="page"]').value.trim();
  const charsInput = card.querySelector('[data-field="chars"]').value;
  const page = parseInt(pageInput, 10);
  if (!page || page < 1) { toast('請輸入有效的頁碼', 'error'); return; }
  const chars = parseCharString(charsInput);
  if (chars.length === 0) { toast('請輸入該頁的字', 'error'); return; }
  const existing = (db.book_pages[uploadSession.bookId] || {})[String(page)];
  if (existing && existing.chars && existing.chars.length > 0) {
    if (!confirm(`第 ${page} 頁已有資料（${existing.chars.length} 字）。覆蓋？`)) return;
  }
  savePage(uploadSession.bookId, page, chars, '');
  f.savedPage = page;
  f.pageInput = String(page);
  f.charsInput = chars.join('、');
  f.skipped = false;
  toast(`已存到第 ${page} 頁（${chars.length} 字）`, 'success');
  render();
}

// 切字串：頓號、逗號、句號、空白、換行、分號都當分隔
function parseCharString(s) {
  if (!s) return [];
  return s.split(/[\s,，、;；。\n\r]+/).map(x => x.trim()).filter(x => x.length > 0)
    // 進一步只保留 CJK 字（每段也許還是混到標點）
    .flatMap(seg => extractChars(seg));
}

function savePage(bookId, pageNum, charsArr, topic) {
  db.book_pages[bookId] = db.book_pages[bookId] || {};
  db.book_pages[bookId][String(pageNum)] = {
    chars: charsArr,
    topic: topic || (db.book_pages[bookId][String(pageNum)] && db.book_pages[bookId][String(pageNum)].topic) || '',
  };
  saveDB();
}

function finishUploadSession() {
  const bookId = uploadSession.bookId;
  uploadSession.frames = [];
  switchView('book', { id: bookId });
}

// ---------- 影片擷取 ----------
async function handleUploadFiles(fileList) {
  const files = Array.from(fileList || []);
  if (files.length === 0) return;
  if (uploadSession.extracting) { toast('上一個工作還在處理中', 'error'); return; }
  uploadSession.extracting = true;

  const interval = parseFloat(document.getElementById('frame-interval').value) || 1;
  const progressBox = document.getElementById('extract-progress');
  const fill = document.getElementById('extract-progress-fill');
  const text = document.getElementById('extract-progress-text');
  progressBox.style.display = '';

  let totalDone = 0;
  let totalSteps = 0;
  // Pre-count: photos = 1 step each, videos = unknown until metadata, so estimate by file count
  totalSteps = files.length;
  const setProgress = (label, ratio) => {
    fill.style.width = (ratio * 100).toFixed(1) + '%';
    text.textContent = label;
  };

  try {
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      const baseLabel = `(${i+1}/${files.length}) ${f.name}`;
      if (f.type.startsWith('video/')) {
        setProgress(baseLabel + ' 解析影片中…', i / files.length);
        const frames = await extractFramesFromVideo(f, interval, (cur, dur) => {
          setProgress(`${baseLabel}　${cur.toFixed(1)} / ${dur.toFixed(1)} 秒`, (i + cur / dur) / files.length);
        });
        for (const fr of frames) {
          uploadSession.frames.push({
            id: uid('fr'),
            dataURL: fr.dataURL,
            label: `${fr.timeSec.toFixed(0)}s @ ${f.name}`,
            timeSec: fr.timeSec,
            pageInput: '',
            charsInput: '',
            savedPage: null,
            skipped: false,
          });
        }
      } else if (f.type.startsWith('image/')) {
        setProgress(baseLabel + ' 載入照片中…', i / files.length);
        const dataURL = await loadPhotoFile(f);
        uploadSession.frames.push({
          id: uid('fr'),
          dataURL,
          label: f.name,
          timeSec: null,
          pageInput: '',
          charsInput: '',
          savedPage: null,
          skipped: false,
        });
      }
      setProgress(baseLabel + ' 完成', (i + 1) / files.length);
    }
    toast(`已擷取 ${uploadSession.frames.length} 張`, 'success');
  } catch (err) {
    console.error(err);
    toast('處理失敗：' + err.message, 'error');
  } finally {
    uploadSession.extracting = false;
    setTimeout(() => { progressBox.style.display = 'none'; }, 600);
    render();
    // 上傳完自動跑 AI 辨識（若有 API key 且開啟 autoRecognize）
    if (apiConfig.apiKey && apiConfig.autoRecognize) {
      batchRecognizeAll();
    }
  }
}

function extractFramesFromVideo(file, intervalSec, onProgress) {
  return new Promise((resolve, reject) => {
    const video = document.createElement('video');
    video.preload = 'auto';
    video.muted = true;
    video.playsInline = true;
    const url = URL.createObjectURL(file);
    video.src = url;

    video.onerror = () => reject(new Error('無法載入影片（瀏覽器可能不支援此格式）'));
    video.onloadedmetadata = async () => {
      const duration = isFinite(video.duration) ? video.duration : 0;
      if (!duration) {
        URL.revokeObjectURL(url);
        return reject(new Error('影片時長為 0，無法擷取'));
      }
      // 縮圖最大寬 640 以省記憶體
      const maxW = 640;
      const ratio = Math.min(1, maxW / (video.videoWidth || maxW));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round((video.videoWidth || maxW) * ratio);
      canvas.height = Math.round((video.videoHeight || maxW * 9 / 16) * ratio);
      const ctx = canvas.getContext('2d');

      const frames = [];
      const seekTo = (t) => new Promise((res) => {
        const handler = () => { video.removeEventListener('seeked', handler); res(); };
        video.addEventListener('seeked', handler);
        // Clamp slightly before end to avoid hang
        video.currentTime = Math.min(t, Math.max(0, duration - 0.05));
      });

      try {
        for (let t = 0; t < duration; t += intervalSec) {
          await seekTo(t);
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const dataURL = canvas.toDataURL('image/jpeg', 0.7);
          frames.push({ dataURL, timeSec: t });
          if (onProgress) onProgress(t, duration);
        }
        URL.revokeObjectURL(url);
        resolve(frames);
      } catch (e) {
        URL.revokeObjectURL(url);
        reject(e);
      }
    };
  });
}

function loadPhotoFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      // 同樣壓縮成 640 寬 jpeg 以省記憶體
      const img = new Image();
      img.onload = () => {
        const maxW = 1024;
        const ratio = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * ratio);
        canvas.height = Math.round(img.height * ratio);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => reject(new Error('照片解碼失敗：' + file.name));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('讀取檔案失敗：' + file.name));
    reader.readAsDataURL(file);
  });
}

// ---------- Lightbox ----------
function openLightbox(src) {
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = `<img src="${src}" alt="" />`;
  lb.addEventListener('click', () => lb.remove());
  document.body.appendChild(lb);
}

// 字帖編輯（新增字帖、編輯字帖、手動新增/編輯/刪除頁）
// =================================================================
function openBookForm(id) {
  const isEdit = !!id;
  const b = isEdit
    ? (db.books || []).find(x => x.id === id)
    : { id: uid('book'), name: '', description: '', page_range: '', page_number_format: '阿拉伯數字', structure: '' };
  if (!b) return;
  const html = `
    <form id="book-form" class="form-grid">
      <div class="field full">
        <label>字帖名稱<span class="required">*</span></label>
        <input type="text" name="name" required value="${escapeHTML(b.name)}" placeholder="例：學院字帖、楷書範本" />
      </div>
      <div class="field full">
        <label>描述 / 備註</label>
        <input type="text" name="description" value="${escapeHTML(b.description || '')}" placeholder="例：綠色書緣厚字帖" />
      </div>
      <div class="field">
        <label>頁碼範圍</label>
        <input type="text" name="page_range" value="${escapeHTML(b.page_range || '')}" placeholder="例：6-134" />
      </div>
      <div class="field">
        <label>頁碼格式</label>
        <input type="text" name="page_number_format" value="${escapeHTML(b.page_number_format || '')}" placeholder="阿拉伯數字 / 中文數字" />
      </div>
      <div class="field full">
        <label>結構說明</label>
        <input type="text" name="structure" value="${escapeHTML(b.structure || '')}" placeholder="例：每頁 7-8 個字" />
      </div>
      <div class="form-actions full">
        ${isEdit ? `<button type="button" class="danger" onclick="deleteBook('${b.id}')">🗑 刪除字帖</button>` : ''}
        <div style="flex:1"></div>
        <button type="button" class="ghost" onclick="closeModal()">取消</button>
        <button type="submit" class="primary">${isEdit ? '更新' : '新增'}</button>
      </div>
    </form>
  `;
  openModal(isEdit ? '編輯字帖' : '新增字帖', html);

  document.getElementById('book-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const updated = {
      ...b,
      name: fd.get('name').trim(),
      description: fd.get('description'),
      page_range: fd.get('page_range'),
      page_number_format: fd.get('page_number_format'),
      structure: fd.get('structure'),
    };
    if (!isEdit) {
      db.books.push(updated);
      db.book_pages[updated.id] = db.book_pages[updated.id] || {};
    } else {
      const idx = db.books.findIndex(x => x.id === id);
      db.books[idx] = updated;
    }
    saveDB();
    closeModal();
    toast(isEdit ? '字帖已更新' : '字帖已新增', 'success');
    render();
  });
}

function deleteBook(id) {
  const b = db.books.find(x => x.id === id);
  if (!b) return;
  const pageCount = Object.keys(db.book_pages[id] || {}).length;
  const compsUsing = (db.competitions || []).filter(c => c.source_book_id === id);
  let msg = `確定要刪除字帖「${b.name}」？已收錄 ${pageCount} 頁將一併刪除。`;
  if (compsUsing.length > 0) msg += `\n\n有 ${compsUsing.length} 場比賽正在使用這本字帖，這些比賽的「來源字帖」會變成空白。`;
  if (!confirm(msg)) return;
  db.books = db.books.filter(x => x.id !== id);
  delete db.book_pages[id];
  // 把使用此字帖的比賽 source_book_id 改為第一本剩下的字帖（若有），否則空字串
  const fallback = (db.books[0] && db.books[0].id) || '';
  for (const c of (db.competitions || [])) {
    if (c.source_book_id === id) c.source_book_id = fallback;
  }
  if (uploadSession.bookId === id) uploadSession.bookId = fallback;
  saveDB();
  closeModal();
  toast('字帖已刪除', 'success');
  if (view.name === 'book') switchView('books');
  else render();
}

function openManualPageForm(bookId, pageNum) {
  const isEdit = pageNum != null;
  const existing = isEdit ? (db.book_pages[bookId] || {})[String(pageNum)] : null;
  const html = `
    <form id="page-form" class="form-grid">
      <div class="field">
        <label>頁碼<span class="required">*</span></label>
        <input type="number" name="page" required value="${isEdit ? pageNum : ''}" ${isEdit ? 'readonly' : ''} placeholder="例：30" />
      </div>
      <div class="field">
        <label>頁面主題（選填）</label>
        <input type="text" name="topic" value="${escapeHTML(existing?.topic || '')}" placeholder="例：特色筆法─橫畫" />
      </div>
      <div class="field full">
        <label>這頁的字<span class="required">*</span></label>
        <textarea name="chars" required placeholder="可用、 ， 空白 換行 分隔">${escapeHTML((existing?.chars || []).join('、'))}</textarea>
      </div>
      <div class="form-actions full">
        ${isEdit ? `<button type="button" class="danger" onclick="deletePage('${bookId}', ${pageNum})">🗑 刪除這頁</button>` : ''}
        <div style="flex:1"></div>
        <button type="button" class="ghost" onclick="closeModal()">取消</button>
        <button type="submit" class="primary">${isEdit ? '更新' : '新增'}</button>
      </div>
    </form>
  `;
  openModal(isEdit ? `編輯第 ${pageNum} 頁` : '手動新增一頁', html);

  document.getElementById('page-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const page = parseInt(fd.get('page'), 10);
    if (!page) { toast('請輸入有效頁碼', 'error'); return; }
    const chars = parseCharString(fd.get('chars'));
    if (chars.length === 0) { toast('請至少輸入一個字', 'error'); return; }
    if (!isEdit) {
      const existing2 = (db.book_pages[bookId] || {})[String(page)];
      if (existing2 && existing2.chars && existing2.chars.length > 0) {
        if (!confirm(`第 ${page} 頁已有資料。覆蓋？`)) return;
      }
    }
    savePage(bookId, page, chars, fd.get('topic'));
    closeModal();
    toast(isEdit ? '頁面已更新' : '頁面已新增', 'success');
    if (view.name === 'book') switchView('book', { id: bookId, page });
    else render();
  });
}

function deletePage(bookId, pageNum) {
  if (!confirm(`確定要刪除第 ${pageNum} 頁？`)) return;
  if (db.book_pages[bookId]) delete db.book_pages[bookId][String(pageNum)];
  saveDB();
  closeModal();
  toast(`已刪除第 ${pageNum} 頁`, 'success');
  switchView('book', { id: bookId });
}

// =================================================================
// Modal
// =================================================================
function openModal(title, bodyHTML) {
  closeModal();
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.id = 'modal-backdrop';
  wrap.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">${escapeHTML(title)}</h2>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">${bodyHTML}</div>
    </div>
  `;
  wrap.addEventListener('click', (e) => {
    if (e.target === wrap) closeModal();
  });
  document.body.appendChild(wrap);
}
function closeModal() {
  const m = document.getElementById('modal-backdrop');
  if (m) m.remove();
}

// =================================================================
// Import / Export / Reset
// =================================================================
function exportJSON() {
  const data = JSON.stringify(db, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-');
  a.href = url;
  a.download = `字帖資料-備份-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('已匯出 JSON 備份', 'success');
}

function importJSON(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const obj = JSON.parse(e.target.result);
      if (!obj || typeof obj !== 'object') throw new Error('JSON 結構不合法');
      if (!obj.books || !obj.book_pages) throw new Error('缺少 books 或 book_pages');
      if (!confirm('匯入會覆蓋目前所有資料（建議先匯出備份）。確定繼續？')) return;
      db = obj;
      // Ensure required fields exist
      db.competitions = db.competitions || [];
      db.pending_uploads = db.pending_uploads || [];
      db.students = db.students || [];
      db.char_radicals = db.char_radicals || {};
      saveDB();
      toast('匯入完成', 'success');
      render();
    } catch (err) {
      console.error(err);
      toast('匯入失敗：' + err.message, 'error');
    }
  };
  reader.readAsText(file);
}

function resetSeed() {
  if (!confirm('確定要重置為初始種子資料？\n目前 localStorage 中的資料會被覆蓋（建議先匯出備份）。')) return;
  db = JSON.parse(JSON.stringify(window.SEED_DATA));
  saveDB();
  toast('已重置為種子資料', 'success');
  render();
}

// 點學生字庫的字 → 跳到字帖那一頁（並帶著學生，該頁會亮出已學 ✓）
function jumpToCharSource(studentId, ch) {
  const entries = (db.char_index && db.char_index[ch]) || [];
  if (entries.length === 0) {
    toast(`「${ch}」不在任何字帖中（是老師額外教的字）`, 'error');
    return;
  }
  const e = entries[0];
  switchView('book', { id: e.book_id, page: e.page, stu: studentId });
  toast(`「${ch}」在 ${bookNameById(e.book_id)} 第 ${e.page} 頁`, 'success');
}

// 整本字帖收錄的所有字（Set）
function bookCharSet(bookId) {
  const set = new Set();
  const pages = db.book_pages[bookId] || {};
  for (const p in pages) {
    for (const ch of (pages[p].chars || [])) set.add(ch);
  }
  return set;
}

// 字帖頁點字：切換學生「已學 / 未學」
function toggleLearnedFromBook(studentId, ch, bookId, pageStr) {
  const s = (db.students || []).find(x => x.id === studentId);
  if (!s || !ch) return;
  const set = new Set(s.learned_chars || []);
  if (set.has(ch)) {
    set.delete(ch);
    // 同步從分組移除
    s.char_groups = (s.char_groups || [])
      .map(g => ({ ...g, chars: g.chars.filter(x => x !== ch) }))
      .filter(g => g.chars.length > 0);
    toast(`「${ch}」已改為未學`, 'success');
  } else {
    set.add(ch);
    toast(`「${ch}」已標記為 ${s.name} 已學 ✓`, 'success');
  }
  s.learned_chars = [...set];
  s.updated_at = todayISO();
  saveDB();
  switchView('book', { id: bookId, page: parseInt(pageStr, 10), stu: studentId });
}

// 把字加進現有分組（同步進字庫）
function addCharsToGroup(studentId, groupId) {
  const s = db.students.find(x => x.id === studentId);
  if (!s) return;
  const g = (s.char_groups || []).find(x => x.id === groupId);
  if (!g) return;
  const input = prompt(`要加進「${g.label || g.chars.slice(0, 3).join('') + '…組'}」的字：`, '');
  if (input === null) return;
  const cs = extractChars(input);
  if (cs.length === 0) { toast('沒有偵測到中文字', 'error'); return; }
  const gset = new Set(g.chars);
  const lset = new Set(s.learned_chars || []);
  let added = 0;
  for (const ch of cs) {
    if (!gset.has(ch)) { gset.add(ch); added++; }
    lset.add(ch);
  }
  g.chars = [...gset];
  s.learned_chars = [...lset];
  s.updated_at = todayISO();
  saveDB();
  toast(`已加 ${added} 個字到這組（同步進字庫）`, 'success');
  switchView('student', { id: studentId, mode: 'groups' });
}

// 新增分組（組名 + 字，字同步進字庫）
function openNewGroupForm(studentId) {
  const s = db.students.find(x => x.id === studentId);
  if (!s) return;
  openModal('新增分組', `
    <form id="newgroup-form" class="form-grid">
      <div class="field full">
        <label>組名（例：走之旁、寒字頭、木部）</label>
        <input type="text" name="label" placeholder="可留空，會自動用前幾個字當名稱" />
      </div>
      <div class="field full">
        <label>這組的字<span class="required">*</span></label>
        <textarea name="chars" required placeholder="例：退逆過遊遂迷還遲道（新字會自動加進字庫）"></textarea>
      </div>
      <div class="form-actions full">
        <button type="button" class="ghost" onclick="closeModal()">取消</button>
        <button type="submit" class="primary">新增分組</button>
      </div>
    </form>
  `);
  document.getElementById('newgroup-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const cs = [...new Set(extractChars(fd.get('chars')))];
    if (cs.length === 0) { toast('沒有偵測到中文字', 'error'); return; }
    s.char_groups = s.char_groups || [];
    s.char_groups.push({ id: uid('grp'), label: (fd.get('label') || '').trim(), chars: cs });
    const lset = new Set(s.learned_chars || []);
    for (const ch of cs) lset.add(ch);
    s.learned_chars = [...lset];
    s.updated_at = todayISO();
    saveDB();
    closeModal();
    toast(`分組已新增（${cs.length} 字，已同步進字庫）`, 'success');
    switchView('student', { id: studentId, mode: 'groups' });
  });
}

// ---------- 字庫維護 ----------
function addLearnedChars(studentId) {
  const ta = document.getElementById('student-add-chars');
  if (!ta) return;
  const chars = extractChars(ta.value);
  if (chars.length === 0) { toast('沒有偵測到中文字', 'error'); return; }
  const s = db.students.find(x => x.id === studentId);
  if (!s) return;
  const set = new Set(s.learned_chars || []);
  let added = 0;
  for (const ch of chars) {
    if (!set.has(ch)) { set.add(ch); added++; }
  }
  s.learned_chars = [...set];

  // 兩個字以上的行 → 自動存成「同類型組」（老師的分類方式：同行＝同型一起練）
  let groupsAdded = 0;
  const groupLines = !!(document.getElementById('student-group-lines') || {}).checked;
  if (groupLines) {
    s.char_groups = s.char_groups || [];
    for (const line of ta.value.split(/\r?\n/)) {
      const cs = [...new Set(extractChars(line))];
      if (cs.length >= 2) {
        s.char_groups.push({ id: uid('grp'), label: '', chars: cs });
        groupsAdded++;
      }
    }
  }

  s.updated_at = todayISO();
  saveDB();
  toast(`已加入 ${added} 個新字${chars.length - added > 0 ? `（${chars.length - added} 個重複已略過）` : ''}${groupsAdded ? `、${groupsAdded} 個同類型組` : ''}`, 'success');
  switchView('student', { id: studentId, mode: groupsAdded ? 'groups' : view.params.mode });
}

function removeLearnedChar(studentId, ch) {
  const s = db.students.find(x => x.id === studentId);
  if (!s) return;
  if (!confirm(`把「${ch}」從 ${s.name} 的字庫移除？`)) return;
  s.learned_chars = (s.learned_chars || []).filter(x => x !== ch);
  // 同步從所有分組移除；組空了就刪掉
  s.char_groups = (s.char_groups || [])
    .map(g => ({ ...g, chars: g.chars.filter(x => x !== ch) }))
    .filter(g => g.chars.length > 0);
  s.updated_at = todayISO();
  saveDB();
  toast(`已移除「${ch}」`, 'success');
  switchView('student', { id: studentId, mode: 'all' });
}

// ---------- 分類 ----------
// 依字帖頁分組：同頁的字書法結構相近（字帖本身就是分類）
function groupByBookPage(chars) {
  const groups = {};
  const none = [];
  for (const ch of chars) {
    const entries = (db.char_index && db.char_index[ch]) || [];
    if (entries.length === 0) { none.push(ch); continue; }
    const e = entries[0];
    const pageData = (db.book_pages[e.book_id] || {})[String(e.page)] || {};
    const label = `${bookNameById(e.book_id)}｜第 ${e.page} 頁${pageData.topic ? `（${pageData.topic}）` : ''}`;
    const key = `${e.book_id}#${String(e.page).padStart(4, '0')}`;
    (groups[key] = groups[key] || { label, chars: [] }).chars.push(ch);
  }
  const sorted = Object.keys(groups).sort().map(k => groups[k]);
  if (none.length > 0) sorted.push({ label: '未收錄在任何字帖（可到補資料補頁碼）', chars: none, warn: true });
  return sorted;
}

// 依部首分組（用 db.char_radicals 快取；沒分類的列在 unclassified）
function groupByRadical(chars) {
  const groups = {};
  const unclassified = [];
  for (const ch of chars) {
    const rad = (db.char_radicals || {})[ch];
    if (!rad) { unclassified.push(ch); continue; }
    (groups[rad] = groups[rad] || []).push(ch);
  }
  const sorted = Object.entries(groups)
    .sort((a, b) => b[1].length - a[1].length)
    .map(([rad, cs]) => ({ label: `${rad} 部（${cs.length} 字）`, chars: cs }));
  return { groups: sorted, unclassified };
}

// 用 Claude 把還沒分類的字配部首，結果存 db.char_radicals（跨學生共用、只花一次）
async function aiClassifyRadicals(studentId) {
  if (!apiConfig.apiKey) {
    toast('請先到 ⚙️ 設定填入 API key', 'error');
    openApiSettings();
    return;
  }
  const s = (db.students || []).find(x => x.id === studentId);
  if (!s) return;
  const unclassified = (s.learned_chars || []).filter(ch => !(db.char_radicals || {})[ch]);
  if (unclassified.length === 0) { toast('沒有需要分類的字', 'success'); return; }
  const btn = document.getElementById('btn-ai-classify');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 分類中…'; }
  try {
    const CHUNK = 150;
    for (let i = 0; i < unclassified.length; i += CHUNK) {
      const batch = unclassified.slice(i, i + CHUNK);
      const prompt = `以下是一批繁體中文字，請判斷每個字的康熙部首。回傳嚴格 JSON 物件，key 是字、value 是部首，例如 {"清":"水","把":"手","想":"心"}。每個字都要有。不要 markdown、不要解釋，只回 JSON。\n\n字：${batch.join('')}`;
      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'x-api-key': apiConfig.apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
          'content-type': 'application/json',
        },
        body: JSON.stringify({
          model: apiConfig.model,
          max_tokens: 4096,
          messages: [{ role: 'user', content: prompt }],
        }),
      });
      if (!resp.ok) {
        const t = await resp.text().catch(() => '');
        throw new Error(`API ${resp.status}: ${t.slice(0, 150)}`);
      }
      const data = await resp.json();
      const text = (data.content && data.content[0] && data.content[0].text) || '';
      const cleaned = text.trim().replace(/^```json\s*/i, '').replace(/^```\s*/, '').replace(/\s*```$/, '');
      const map = JSON.parse(cleaned);
      db.char_radicals = db.char_radicals || {};
      for (const [ch, rad] of Object.entries(map)) {
        if (typeof rad === 'string' && rad.trim()) db.char_radicals[ch] = rad.trim();
      }
      saveDB();
    }
    toast('部首分類完成', 'success');
  } catch (e) {
    console.error(e);
    toast('分類失敗：' + e.message, 'error');
  }
  switchView('student', { id: studentId, mode: 'radical' });
}

// ---------- 從字庫出題 ----------
function makeSheetFromStudent(id, type) {
  const s = (db.students || []).find(x => x.id === id);
  if (!s) return;
  const pool = [...(s.learned_chars || [])];
  if (pool.length === 0) { toast('這位學生的字庫還是空的', 'error'); return; }
  const want = type === 'lang'
    ? Math.max(2, sheetConfig.langPerCol || 10) * Math.max(1, sheetConfig.langCols || 5)
    : 28;
  // Fisher-Yates 洗牌
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const picked = pool.slice(0, Math.min(want, pool.length));
  sheetConfig.type = type;
  sheetConfig.content = picked.join('');
  if (type === 'k4') {
    if (s.school) sheetConfig.sigSchool = s.school;
    if (s.name) sheetConfig.sigName = s.name;
  }
  saveSheetConfig();
  switchView('sheet');
  toast(`已從 ${s.name} 的字庫隨機抓 ${picked.length} 字${picked.length < want ? `（字庫共 ${s.learned_chars.length} 字，不足 ${want}）` : ''}`, 'success');
}

// 落款各項目的文字
function sigPartValues() {
  return {
    event: (sheetConfig.sigEvent || '').trim(),
    school: (sheetConfig.sigSchool || '').trim(),
    year: `${ganzhiOfYear(sheetConfig.sigYear)}${sheetConfig.sigConnector || ''}${sheetConfig.sigSeason || ''}`,
    name: (sheetConfig.sigName || '').trim() + (sheetConfig.sigShu ? '書' : ''),
  };
}

// 依落款格式組出各行（右→左）
function composeSigLines(formatKey) {
  const f = SIG_FORMATS.find(x => x.key === formatKey) || SIG_FORMATS[0];
  if (!f.parts) return (sheetConfig.sigCustom || []).map(s => (s || '').trim()).filter(Boolean).slice(0, 3);
  const p = sigPartValues();
  return f.parts.map(group => group.map(k => p[k]).join('')).filter(Boolean);
}

function buildSigLines() {
  return composeSigLines(sheetConfig.sigFormat);
}

function updateSheetPreview() {
  const box = document.getElementById('sheet-preview-container');
  if (!box) return;
  const { html, W, H, warn } = buildSheetHTML();
  const s = Math.min(1, previewWidth(box) / (W * MM2PX));
  box.innerHTML = `
    <div class="sheet-preview-wrap">
      <div class="sheet-clip" style="width:${(W * MM2PX * s).toFixed(0)}px;height:${(H * MM2PX * s).toFixed(0)}px;overflow:hidden;">
        <div id="sheet-root" style="transform:scale(${s});transform-origin:top left;">${html}</div>
      </div>
    </div>
  `;
  const cnt = document.getElementById('sheet-char-count');
  if (cnt) cnt.textContent = `共 ${extractChars(sheetConfig.content || '').length} 個字`;
  const w = document.getElementById('sheet-warn');
  if (w) w.textContent = warn || '';
  const sp = document.getElementById('sheet-sig-preview');
  if (sp) sp.textContent = buildSigLines().join('／') || '（無）';
}

// 產生整張題目單 HTML（mm 精準排版，直接可印）
function buildSheetHTML() {
  const paper = PAPERS[sheetConfig.paper] || PAPERS.A4;
  const W = paper.w, H = paper.h, M = 10, GAP = 6;
  const n = Math.max(1, Math.min(3, sheetConfig.copies || 1));
  const availW = W - M * 2, availH = H - M * 2;
  const copyW = (availW - GAP * (n - 1)) / n, copyH = availH;
  const chars = extractChars(sheetConfig.content || '');
  const fontStack = (SHEET_FONTS[sheetConfig.font] || SHEET_FONTS.kai).stack;
  const line = sheetConfig.type === 'lang'
    ? (SHEET_LINE_COLORS[sheetConfig.lineColor] || SHEET_LINE_COLORS.red)
    : (SHEET_LINE_COLORS[sheetConfig.k4LineColor] || SHEET_LINE_COLORS.gray);
  let copyInner = '', warn = '';

  if (sheetConfig.type === 'lang') {
    const perCol = Math.max(2, sheetConfig.langPerCol || 10);
    const minCols = Math.max(1, sheetConfig.langCols || 5);
    const cols = Math.max(minCols, Math.ceil(chars.length / perCol) || minCols);
    if (chars.length > perCol * minCols) {
      warn = `字數 ${chars.length} 超過 ${minCols} 行 × ${perCol} 字 = ${perCol * minCols} 字，已自動增加為 ${cols} 行`;
    }
    copyInner = buildGridHTML(chars, cols, perCol, copyW, copyH, line, fontStack, null);
  } else {
    const perCol = Math.max(2, sheetConfig.k4PerCol || 8);
    const poemCols = Math.max(1, Math.ceil(chars.length / perCol));
    let sigInfo = null;
    if (sheetConfig.showSig) {
      const lines = buildSigLines();
      if (lines.length > 0) {
        const emptyInLast = poemCols * perCol - chars.length;
        if (emptyInLast >= 3) {
          sigInfo = { lines, startRow: chars.length % perCol, totalCols: poemCols };
        } else {
          // 最後一行太滿，左邊多加一行放落款
          sigInfo = { lines, startRow: Math.min(2, Math.max(0, perCol - 4)), totalCols: poemCols + 1 };
        }
      }
    }
    const totalCols = sigInfo ? sigInfo.totalCols : poemCols;
    copyInner = sheetConfig.k4Style === 'grid'
      ? buildGridHTML(chars, totalCols, perCol, copyW, copyH, line, fontStack, sigInfo)
      : buildK4OfficialHTML(chars, totalCols, perCol, copyW, copyH, line, fontStack, sigInfo);
  }

  // 組合 n 份（左右並排，中間放裁切虛線）
  let inner = '';
  for (let i = 0; i < n; i++) {
    const x = M + i * (copyW + GAP);
    inner += `<div style="position:absolute;left:${x.toFixed(2)}mm;top:${M}mm;width:${copyW.toFixed(2)}mm;height:${copyH.toFixed(2)}mm;">${copyInner}</div>`;
    if (i < n - 1) {
      const cx = x + copyW + GAP / 2;
      inner += `<div style="position:absolute;left:${cx.toFixed(2)}mm;top:${M}mm;height:${copyH.toFixed(2)}mm;border-left:0.2mm dashed #aaaaaa;"></div>`;
    }
  }
  const html = `<div class="print-sheet" style="width:${W}mm;height:${H}mm;">${inner}</div>`;
  return { html, W, H, warn };
}

// 直式方格：由右至左、由上至下填字；sigInfo 有值時在最左行下方放直式落款
function buildGridHTML(chars, totalCols, perCol, areaW, areaH, line, fontStack, sigInfo) {
  const cell = Math.min(areaW / totalCols, areaH / perCol);
  const gw = cell * totalCols, gh = cell * perCol;
  const ox = (areaW - gw) / 2, oy = (areaH - gh) / 2;
  const fs = cell * 0.72;
  let out = '';

  // 外框
  out += `<div style="position:absolute;left:${ox.toFixed(2)}mm;top:${oy.toFixed(2)}mm;width:${gw.toFixed(2)}mm;height:${gh.toFixed(2)}mm;border:0.45mm solid ${line};box-sizing:border-box;"></div>`;

  // 格子與字
  for (let cssCol = 0; cssCol < totalCols; cssCol++) {
    const colFromRight = totalCols - 1 - cssCol;
    for (let row = 0; row < perCol; row++) {
      const idx = colFromRight * perCol + row;
      const ch = idx < chars.length ? chars[idx] : '';
      const x = ox + cssCol * cell, y = oy + row * cell;
      const borders =
        (cssCol < totalCols - 1 ? `border-right:0.15mm solid ${line};` : '') +
        (row < perCol - 1 ? `border-bottom:0.15mm solid ${line};` : '');
      out += `<div style="position:absolute;left:${x.toFixed(2)}mm;top:${y.toFixed(2)}mm;width:${cell.toFixed(2)}mm;height:${cell.toFixed(2)}mm;${borders}box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-family:${fontStack};font-size:${fs.toFixed(2)}mm;line-height:1;color:#1a1a1a;">${escapeHTML(ch)}</div>`;
    }
  }

  if (sigInfo && sigInfo.lines.length > 0) {
    out += buildSigHTML(sigInfo.lines, ox, oy, cell, sigInfo.startRow, perCol, fontStack);
  }

  return out;
}

// 4K 正式版：雙線外框＋直行線（不畫橫線），右起直讀
function buildK4OfficialHTML(chars, totalCols, perCol, areaW, areaH, line, fontStack, sigInfo) {
  const D = 1.4, pad = D + 1;   // D：外框與內框的距離
  const cell = Math.min((areaW - pad * 2) / totalCols, (areaH - pad * 2) / perCol);
  const gw = cell * totalCols, gh = cell * perCol;
  const ox = (areaW - gw) / 2, oy = (areaH - gh) / 2;
  const f = v => v.toFixed(2) + 'mm';
  let out = '';
  out += `<div style="position:absolute;left:${f(ox - D)};top:${f(oy - D)};width:${f(gw + D * 2)};height:${f(gh + D * 2)};border:0.5mm solid ${line};box-sizing:border-box;"></div>`;
  out += `<div style="position:absolute;left:${f(ox)};top:${f(oy)};width:${f(gw)};height:${f(gh)};border:0.2mm solid ${line};box-sizing:border-box;"></div>`;
  for (let k = 1; k < totalCols; k++) {
    out += `<div style="position:absolute;left:${f(ox + k * cell)};top:${f(oy)};height:${f(gh)};border-left:0.2mm solid ${line};"></div>`;
  }
  chars.forEach((ch, idx) => {
    const col = Math.floor(idx / perCol), row = idx % perCol;
    const x = ox + (totalCols - 1 - col) * cell, y = oy + row * cell;
    out += `<div style="position:absolute;left:${f(x)};top:${f(y)};width:${f(cell)};height:${f(cell)};display:flex;align-items:center;justify-content:center;font-family:${fontStack};font-size:${f(cell * 0.74)};line-height:1;color:#1a1a1a;">${escapeHTML(ch)}</div>`;
  });
  if (sigInfo && sigInfo.lines.length > 0) {
    out += buildSigHTML(sigInfo.lines, ox, oy, cell, sigInfo.startRow, perCol, fontStack);
  }
  return out;
}

// 直式落款，寫在最左一行 startRow 之後：第一行靠右，後面的行往左且起筆略低；字太多就整體縮小
function buildSigHTML(lines, colX, gridY, cell, startRow, perCol, fontStack) {
  const n = Math.min(3, lines.length);
  if (!n) return '';
  const L = SIG_LAYOUT[n];
  const LS = 0.06;
  const row0 = Math.max(0, Math.min(perCol - 1, startRow));
  let k = 1;
  lines.slice(0, n).forEach((t, j) => {
    const need = [...t].length * (L.fs + LS);
    const avail = perCol - row0 - L.ys[j] - 0.12;
    if (avail > 0 && need > avail) k = Math.min(k, avail / need);
  });
  const fs = cell * L.fs * k, ls = cell * LS * k;
  const f = v => v.toFixed(2) + 'mm';
  return lines.slice(0, n).map((t, j) => {
    const cx = colX + L.xs[j] * cell;
    const cy = gridY + (row0 + L.ys[j]) * cell;
    return `<div style="position:absolute;left:${f(cx - fs / 2)};top:${f(cy)};width:${f(fs)};writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap;font-family:${fontStack};font-size:${f(fs)};line-height:1;letter-spacing:${f(ls)};color:#1a1a1a;">${escapeHTML(t)}</div>`;
  }).join('');
}

function printSheet() {
  const r = buildSheetHTML();
  printHTML(r.html, r.W, r.H);
}

// 預覽圖寬度：最多 620px，手機上縮到放得進畫面
function previewWidth(box) {
  const pad = window.innerWidth <= 720 ? 26 : 50;   // .sheet-preview-wrap 左右 padding＋邊框
  return Math.max(200, Math.min(620, (box.clientWidth || 620) - pad));
}

// 只印傳進來的那一張（紙張大小 wMm × hMm、無邊界）
function printHTML(html, wMm, hMm) {
  let st = document.getElementById('page-size-style');
  if (!st) {
    st = document.createElement('style');
    st.id = 'page-size-style';
    document.head.appendChild(st);
  }
  st.textContent = `@page { size: ${wMm}mm ${hMm}mm; margin: 0; }`;
  document.getElementById('print-root').innerHTML = html;
  window.print();
}

      commit();

    commit();
  });
  frameWeightEl.addEventListener('change', () => {
    gridConfig.frameWeight = frameWeightEl.value;
    commit();
  });
  gapBtns.forEach(btn => btn.addEventListener('click', () => {
    gridConfig.frameGapCm = parseFloat(btn.dataset.gap);
    gapEl.value = gridConfig.frameGapCm;
    commit();
  }));
  gapEl.addEventListener('input', () => {
    const v = parseFloat(gapEl.value);
    if (!(v >= 0.1 && v <= 10)) return;
    gridConfig.frameGapCm = +v.toFixed(2);
    commit();
  });

  updateGridPreview();
}

// 紙張方向與尺寸：「自動」時直式放得下就用直式，否則改橫式
function gridPageSize() {
  const p = PAPERS[gridConfig.paper] || PAPERS.A4;
  const cell = gridConfig.cellCm * 10;
  const gw = cell * gridConfig.cols, gh = cell * gridConfig.rows;
  const gap = gridConfig.frame ? gridConfig.frameGapCm * 10 : 0;
  const tw = gw + gap * 2, th = gh + gap * 2;   // 含外框的總大小
  const fitsIn = (w, h) => tw <= w + 0.01 && th <= h + 0.01;
  let landscape = gridConfig.orient === 'landscape';
  if (gridConfig.orient === 'auto') landscape = !fitsIn(p.w, p.h) && fitsIn(p.h, p.w);
  const W = landscape ? p.h : p.w, H = landscape ? p.w : p.h;
  return { W, H, landscape, cell, gw, gh, gap, tw, th, fits: fitsIn(W, H) };
}

// 格子紙的所有線條（單位 mm，原點在格子左上角）。畫面、列印、存圖片都畫這一份，尺寸才會一致
function gridPaperLayers() {
  const size = gridPageSize();
  const { cell, gw, gh, gap } = size;
  const { cols, rows } = gridConfig;
  const gs = gridConfig.guides || {};
  const wantCross = gs.cross || gs.mi, wantDiag = gs.mi, wantJiu = gs.jiu;
  const lw = (GRID_WEIGHTS[gridConfig.weight] || GRID_WEIGHTS.mid).w;
  const n = v => +v.toFixed(3);
  const layers = [];

  // 輔助虛線先畫，格線蓋在上面
  if (wantCross || wantDiag || wantJiu) {
    let d = '';
    for (let c = 0; c < cols; c++) {
      for (let r = 0; r < rows; r++) {
        const x = c * cell, y = r * cell;
        if (wantCross) {
          d += `M${n(x + cell / 2)} ${n(y)}V${n(y + cell)}M${n(x)} ${n(y + cell / 2)}H${n(x + cell)}`;
        }
        if (wantDiag) {
          d += `M${n(x)} ${n(y)}L${n(x + cell)} ${n(y + cell)}M${n(x + cell)} ${n(y)}L${n(x)} ${n(y + cell)}`;
        }
        if (wantJiu) {
          [1 / 3, 2 / 3].forEach(t => {
            d += `M${n(x + cell * t)} ${n(y)}V${n(y + cell)}M${n(x)} ${n(y + cell * t)}H${n(x + cell)}`;
          });
        }
      }
    }
    layers.push({ d, w: n(Math.max(0.2, lw * 0.6)), dash: [2, 1.5], opacity: 0.6 });
  }
  // 格線（線的中心剛好在格子邊界上，量起來每格就是設定的公分數）
  let d = '';
  for (let k = 1; k < cols; k++) d += `M${n(k * cell)} 0V${n(gh)}`;
  for (let k = 1; k < rows; k++) d += `M0 ${n(k * cell)}H${n(gw)}`;
  if (d) layers.push({ d, w: lw });
  layers.push({ d: `M0 0H${n(gw)}V${n(gh)}H0Z`, w: n(lw + 0.3) });
  if (gap > 0) {
    const fw = (GRID_WEIGHTS[gridConfig.frameWeight] || GRID_WEIGHTS.thin).w;
    layers.push({ d: `M${n(-gap)} ${n(-gap)}H${n(gw + gap)}V${n(gh + gap)}H${n(-gap)}Z`, w: fw });
  }
  return {
    ...size,
    layers,
    color: SHEET_LINE_COLORS[gridConfig.lineColor] || SHEET_LINE_COLORS.red,
    gx: (size.W - gw) / 2,   // 格子左上角在紙上的位置（置中）
    gy: (size.H - gh) / 2,
  };
}

// 整張格子紙（mm 精準）：SVG 畫在紙張正中間
function buildGridPaperHTML() {
  const g = gridPaperLayers();
  const n = v => +v.toFixed(3);
  const shapes = g.layers.map(l =>
    `<path d="${l.d}" fill="none" stroke="${g.color}" stroke-width="${l.w}"`
    + (l.dash ? ` stroke-dasharray="${l.dash.join(' ')}"` : '')
    + (l.opacity ? ` stroke-opacity="${l.opacity}"` : '')
    + '/>'
  ).join('');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n(g.gw)} ${n(g.gh)}" style="position:absolute;left:${n(g.gx)}mm;top:${n(g.gy)}mm;width:${n(g.gw)}mm;height:${n(g.gh)}mm;overflow:visible;">${shapes}</svg>`;
  const html = `<div class="print-sheet" style="width:${g.W}mm;height:${g.H}mm;overflow:hidden;">${svg}</div>`;
  return {
    html, W: g.W, H: g.H, landscape: g.landscape, fits: g.fits, cell: g.cell,
    gw: g.gw, gh: g.gh, gap: g.gap, tw: g.tw, th: g.th,
    ox: (g.W - g.tw) / 2, oy: (g.H - g.th) / 2,   // 含外框時，最外面到紙邊的留白
  };
}

function updateGridPreview() {

  });
